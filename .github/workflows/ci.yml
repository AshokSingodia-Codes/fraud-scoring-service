name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: fraud-scoring-service:latest

      - name: Container Smoke Test
        run: |
          docker run -d --name fraud_app -p 8000:8000 fraud-scoring-service:latest
          echo "Waiting for container to start..."
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "Container health check passed!"
              docker stop fraud_app
              exit 0
            fi
            echo "Waiting for app startup ($i/15)..."
            sleep 2
          done
          echo "Container health check timed out or failed!"
          echo "--- Container Logs ---"
          docker logs fraud_app
          docker stop fraud_app
          exit 1

