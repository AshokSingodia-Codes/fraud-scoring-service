services:
  - type: web
    name: fraud-scoring-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_API_KEYS
        value: demo-api-key-12345,prod-secret-key-67890
      - key: RATE_LIMIT_REQUESTS
        value: "5000"
      - key: RATE_LIMIT_WINDOW_SEC
        value: "60"
