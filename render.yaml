services:
  # 1. FastAPI Real-Time Scoring Backend
  - type: web
    name: fraud-scoring-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.fraud.serving.app:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: prod
      - key: ALLOWED_API_KEYS
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fraud-redis
          property: connectionString

  # 2. React + Vite Frontend
  - type: web
    name: fraud-scoring-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fraud-scoring-api
          property: host

  # 3. Redis In-Memory Velocity Store
  - type: redis
    name: fraud-redis
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Audit Store
  - name: fraud-db
    plan: free
    databaseName: fraud_db
    user: fraud_user
